<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Quốc Tế Phụ Nữ 8/3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="bg-animation"></div>
    <div class="container">
        <div class="card">
            <h1 class="title">Happy Women's Day, <span id="user-name">Bạn</span>!</h1>
            <div class="input-group" style="margin: 15px 0;">
                <input type="text" id="input-name" placeholder="Nhập tên người nhận..." 
               style="padding: 10px; border-radius: 20px; border: 1px solid var(--primary-color, #ff85a1); width: 80%; outline: none; font-family: 'Quicksand', sans-serif;">
            </div>
            <p class="subtitle">08 - 03 - 2026</p>
            
            <div class="flower-icon">🌸</div>
            
            <p class="description">Gửi những điều ngọt ngào nhất đến một nửa thế giới tuyệt vời.</p>
            
            <button id="btn-wish">Nhận lời chúc ngẫu nhiên</button>
            <div class="action-buttons" style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
                <button id="btn-share" class="secondary-btn">Chia sẻ niềm vui 🚀</button>
                <button id="btn-music" class="icon-btn">🔊</button>
            </div>
            <div id="wish-display" class="wish-box"></div>
            <div id="qrcode-container" style="margin-top: 20px; display: none;">
                <div id="qrcode" style="display: flex; justify-content: center;"></div>
            </div>
        </div>
    </div>

    <audio id="bg-audio" loop>
    <source src="assets/music/jar-of-love.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ phát âm thanh.
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
